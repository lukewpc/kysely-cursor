name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Prettier
    # Baseline bot commits use [skip ci] so we do not re-enter the bench → commit loop.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Prettier check
        run: pnpm run format

  test:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
        kysely: ['0.28.8', '0.28.7', '0.28.6']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Bump Kysely to matrix version (devDependency only)
        run: pnpm up kysely@${{ matrix.kysely }} -D

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Upload coverage reports to Codecov
        if: ${{ matrix.kysely == '0.28.8' && github.ref_name == 'main' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Cursor vs offset pagination benches (testcontainers), one dialect per matrix
  # leg so containers run in parallel. Each leg compares its dialect against the
  # committed baseline and fails on regression. A follow-up job merges artifacts
  # for the sticky PR comment and (on main) the baseline commit.
  bench:
    name: Bench (${{ matrix.dialect }})
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgres, mysql, mssql, sqlite]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm run build

      - name: Run benchmarks (${{ matrix.dialect }})
        # Same shape as the committed baseline for this dialect.
        # Compare scopes baseline cells to dialects present in the current run.
        # Continue so artifacts still upload when noisy; the step outcome gates
        # baseline promotion (via needs.bench.result) and fails the job below.
        id: bench
        continue-on-error: true
        run: >
          pnpm --filter kysely-cursor-bench bench
          -- --dialect ${{ matrix.dialect }}
          --git-sha "${{ github.sha }}"
          --compare
          --fail-on-regression
          --threshold 1.5

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.dialect }}
          path: |
            bench/results/latest-results.json
            bench/results/latest-report.md
          if-no-files-found: ignore

      - name: Fail job on regression
        if: steps.bench.outcome == 'failure'
        run: |
          echo "Benchmark step failed for ${{ matrix.dialect }} (regression or runner error). See logs."
          exit 1

  # Merge matrix results → sticky PR comment; on main, promote baseline only when
  # every dialect job succeeded.
  bench-report:
    name: Bench report
    if: >
      always() &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')) &&
      needs.bench.result != 'cancelled' &&
      needs.bench.result != 'skipped'
    needs: [bench]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # GITHUB_TOKEN cannot bypass "require PR" rulesets. On main, mint an
      # installation token for a GitHub App that is on the ruleset bypass list
      # (secrets: BASELINE_APP_ID + BASELINE_APP_PRIVATE_KEY).
      - name: Create GitHub App token
        id: app-token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BASELINE_APP_ID }}
          private-key: ${{ secrets.BASELINE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # App token on main so git push can bypass ruleset; GITHUB_TOKEN elsewhere.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Merge CLI only needs baseline JSON, but entrypoint modules historically
      # pulled dialects → kysely-cursor/dist. Build keeps the job robust even if
      # imports change; --merge itself no longer requires dist.
      - name: Build library
        run: pnpm run build

      - name: Download dialect artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: bench/artifacts
          merge-multiple: false

      - name: Merge, compare, and write PR comment
        id: merge
        continue-on-error: true
        run: |
          if ! find bench/artifacts -name 'latest-results.json' 2>/dev/null | grep -q .; then
            echo "No dialect result artifacts — skip merge."
            exit 0
          fi
          mkdir -p bench/results
          # pnpm --filter runs with cwd=bench/; use absolute merge paths.
          pnpm --filter kysely-cursor-bench bench -- \
            --merge "${{ github.workspace }}/bench/artifacts" \
            --git-sha "${{ github.sha }}" \
            --compare \
            --threshold 1.5 \
            --comment-out results/pr-comment.md

      - name: Upload merged bench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-merged
          path: |
            bench/results/
            bench/baseline/
            bench/artifacts/
          if-no-files-found: ignore

      - name: Comment benchmark report on PR
        if: github.event_name == 'pull_request' && hashFiles('bench/results/pr-comment.md') != ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: kysely-cursor-bench
          path: bench/results/pr-comment.md

      # Only promote a new baseline when every matrix dialect job passed.
      # A failing main run must not overwrite the regression threshold with worse numbers.
      - name: Update baseline on main
        if: >
          needs.bench.result == 'success' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: |
          if ! find bench/artifacts -name 'latest-results.json' 2>/dev/null | grep -q .; then
            echo "No dialect result artifacts — skip baseline update."
            exit 0
          fi
          # pnpm --filter runs with cwd=bench/; use absolute merge paths.
          pnpm --filter kysely-cursor-bench bench -- \
            --merge "${{ github.workspace }}/bench/artifacts" \
            --git-sha "${{ github.sha }}" \
            --update-baseline

      - name: Commit updated baseline on main
        if: >
          needs.bench.result == 'success' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          hashFiles('bench/baseline/results.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/baseline/results.json bench/baseline/summary.md
          if git diff --staged --quiet; then
            echo "Baseline unchanged"
            exit 0
          fi
          git commit -m "chore(bench): update baseline [skip ci]"
          git push
