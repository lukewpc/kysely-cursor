name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Prettier
    # Baseline bot commits use [skip ci] so we do not re-enter the bench → commit loop.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Prettier check
        run: pnpm run format

  test:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
        # peer floor → latest 0.28 → first/latest 0.29 (full list: scripts/test-kysely-versions.sh)
        kysely:
          - '0.28.6'
          - '0.28.17'
          - '0.29.0'
          - '0.29.4'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Bump Kysely to matrix version
        run: pnpm up -D -r kysely@${{ matrix.kysely }}

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Upload coverage reports to Codecov
        if: ${{ matrix.kysely == '0.29.4' && github.ref_name == 'main' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Cursor vs offset pagination benches (testcontainers). Commits a slim baseline on
  # main; on PRs compares against that baseline and posts a sticky comment.
  bench:
    name: Benchmarks
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so the baseline-update push can trigger without loops via [skip ci]
          # and so we can push to the same ref on main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm run build

      - name: Run benchmarks
        # Full suite so results match the committed baseline shape/config.
        # --compare diffs against bench/baseline/results.json.
        # --fail-on-regression exits 1 when cursor mean ≥ 1.5× baseline.
        # Continue so we still post the PR comment when noisy; baseline is only
        # refreshed after a successful run (see steps below).
        id: bench
        continue-on-error: true
        run: >
          pnpm --filter kysely-cursor-bench bench
          -- --git-sha "${{ github.sha }}"
          --compare
          --fail-on-regression
          --threshold 1.5
          --comment-out results/pr-comment.md

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench/results/
            bench/baseline/
          if-no-files-found: ignore

      - name: Comment benchmark report on PR
        if: github.event_name == 'pull_request' && hashFiles('bench/results/pr-comment.md') != ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: kysely-cursor-bench
          path: bench/results/pr-comment.md

      # Only promote a new baseline when the suite passed (no regression / runner error).
      # A failing main run must not overwrite the regression threshold with worse numbers.
      - name: Update baseline on main
        if: >
          steps.bench.outcome == 'success' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: >
          pnpm --filter kysely-cursor-bench bench
          -- --git-sha "${{ github.sha }}"
          --current results/latest-results.json
          --update-baseline

      - name: Commit updated baseline on main
        if: >
          steps.bench.outcome == 'success' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          hashFiles('bench/baseline/results.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/baseline/results.json bench/baseline/summary.md
          if git diff --staged --quiet; then
            echo "Baseline unchanged"
            exit 0
          fi
          git commit -m "chore(bench): update baseline [skip ci]"
          git push

      - name: Fail job on regression
        if: steps.bench.outcome == 'failure'
        run: |
          echo "Benchmark step failed (regression or runner error). See logs / PR comment."
          exit 1
